# yaml
name: CI-CD Pipeline

on:
  workflow_run:
    workflows:
      -Terraform Infrastructure
    # branches:
    #   - devops1
    types:
      - completed

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: dev-eks-cluster

jobs:

  build-and-push:
    name: Build and Push Docker Images

    # RUN ONLY IF TERRAFORM WORKFLOW SUCCESS
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - order-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: aws-account
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ matrix.service }}:latest \
            ./services/${{ matrix.service }}

      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ matrix.service }}:latest \
            ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ matrix.service }}:latest

      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ matrix.service }}:latest

  deploy:
    name: Deploy to EKS

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Deploy Auth Service
        run: kubectl apply -f kubernetes/auth-service/

      - name: Deploy User Service
        run: kubectl apply -f kubernetes/user-service/

      - name: Deploy Order Service
        run: kubectl apply -f kubernetes/order-service/

      - name: Verify Deployments
        run: |
          kubectl get pods -A
          kubectl get svc -A
# ```
