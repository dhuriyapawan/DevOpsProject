# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: 878445923420.dkr.ecr.us-east-1.amazonaws.com:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: auth-service-config

            - secretRef:
                name: auth-service-secret

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 20
            periodSeconds: 10
---
# ConfigMap for auth-service (ensure no duplicate keys)
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: auth-service
data:
  AWS_REGION: us-east-1
  DB_HOST: auth-db.auth-service.svc.cluster.local
  DB_NAME: authdb
  DB_PORT: "5432"
  PORT: "3000"