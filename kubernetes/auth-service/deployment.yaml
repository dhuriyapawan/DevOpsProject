apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      automountServiceAccountToken: false

      containers:
        - name: auth-service

          # Replace with your actual ECR repository name
          image: 878445923420.dkr.ecr.us-east-1.amazonaws.com/auth-service:1.0.0

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: auth-service-config

            - secretRef:
                name: auth-service-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: auth-service

data:
  # Application configuration (unique keys to avoid duplication)
  PORT: "3000"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "microservicesdb"
  AWS_REGION: "us-east-1"