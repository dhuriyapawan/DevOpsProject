# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      automountServiceAccountToken: false
      containers:
        - name: auth-service

          image: 878445923420.dkr.ecr.us-east-1.amazonaws.com:1.0.0

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: auth-service-config

            - secretRef:
                name: auth-service-secret
 
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
              ephemeral-storage: "512Mi"

            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 20
            periodSeconds: 10
---
# ConfigMap for auth-service
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: auth-service
data: {}